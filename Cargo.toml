[package]
name = "hypothesis-tournament"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Competing explanations for a failing test, ranked by evidence: AI writes the hypotheses, Rust runs the experiments"
license = "MIT"

[[bin]]
name = "tourney"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# A local HTTP server that stands in for the OpenAI API in tests.
wiremock = "0.6.5"
